  - title: Chantal Akerman on Jeanne Dielman
    in:
      title: Camera Obscura
      volume: 1
      issue: 2
      year: 1977
    pages: 118-121
    tags: 
      - Chantal Akerman
      - feminism
      - interview
      - respect
      - scopophilia
      - subjectivity
      - time
    films: 
      - Jeanne Dielman
      - The Beloved Child, or I Play at Being a Married Woman
    notes: |
      - Sources like to say that Akerman did not consider Jeanne Dielman to be a feminist film, but in this interview she explicitly says that she does think it is a feminist film. I think this is an important point to note, because it seems like a lot of people have misinterpreted her stance on this. Not wanting to be pigeonholed as a feminist filmmaker is not the same as not thinking that her work is feminist.
      - This interview also directly discusses her thoughts on respect, which is often cited as a key driver behind the distanced filming style
      - She says that there is only one subjective shot in her films (up to 1977 of course), which is when she looks at the back of the driver's neck in Je, tu, il, elle.
      - She also talks about how "The Beloved Child, or I Play at Being a Married Woman" was a failure due to using duration for mood rather than presence
      - Akerman draws the parallel between Jeanne Dielman and Madame Bovary
      - She invokes the idea of the unconscious, as Jeanne no longer has the strength to uphold the barrier between herself and her unconscious after she has an orgasm
      - She directly addresses the criticism of the murder scene, saying that it is a logical outcome of the film rather than her falling into the need for a sensational climax
      - She also discusses "jouissance du voir"/scopophilia
    quotes:
      - "I do think it's a feminist film because I give space to things which were never, almost never, shown in that way, like the daily gestures of a woman. They are the lowest in the hierarchy of film images. A kiss or a car crash come higher, and I don't think that's an accident. It's because these are women's gestures that they count for so little. That's one reason I think it's a feminist film."
      - "The framing was meant to respect the space, her, and her gestures within it."
      - "It was never shot from the point of view of the son or anyone else. It's always me. Because the other way is manipulation. The son is not the camera; the son is her son. If the son looks at his mother, it's because you asked him to do it. So you should look at the son looking at the mother, and not have the camera in place of the son looking at the mother."
      - "The fact that she was frigid was almost a protection of the one place where she was not alienated"
      - "But the murder was the logical thing to have happen there. To me, she had only two solutions: either to kill herself or kill someone else. Of course there is some part of me in the film and I would have killed some one else. Certain people hate this murder and say, 'You have to be more pure. If you show a woman doing the dishes, you shouldn't show a murder.' But I don't think that's true. The strength of the thing is to show them both in the same film. And it didn't end with the murder. There are seven really very strong minutes after that."

  - title: "Getting Ready for the Golden Eighties: A Conversation with Chantal Akerman"
    author: Indiana, Gary
    in: 
      title: Artforum
      volume: 21
      issue: 10
      year: 1983
    pages: 55-61
    tags:
      - Chantal Akerman
      - interview
      - structuralism
      - desire
      - acting
      - Michael Snow
      - Andy Warhol
      - Franz Kafka
      - Deleuze & Guattari
    notes: |
      - Akerman says she had only seen a couple of Warhol films, counter to what a some sources say about her being heavily influenced by his work
      - Her words about cutting when she feels the shot is finished reminds me of the Every Frame a Painting video essay on editing
      - The oscillation between seeing symbolic objects and pure colour is something like dipping between Lacanian registers
      - The way she describes Michael Snow's films and the difference between them and her own is very interesting. She was obviously heavily influenced by him, as visible in La chambre, Moving In, The Day When, etc., but clearly considers herself apart from the more purely conceptual structuralist approach. I am reminded of this Letterboxd review by Jake Cole of News from Home: "It's too easy and reductive to say of Akerman that she, in comparison to her male contemporaries, found the heart beating within structuralism [...] it is more accurate to say that the director best understood the applications of structuralism not merely to cinema formalism but to the patterns of quotidian life."
      - Akerman disagrees with Paul Morrissey that characters are always revealed through dialogue. She says they are also revealed through gesture, from the back, from every side, and can be revealed even when offscreen.
      - Akerman believes that characters must have some kind of secret that is held in order to drive curiosity in the viewer. Even further, the secret is not held by the character, but by the actor. This seems to interact with various ideas about desire, from Lacan and Proust. It is very visible in La captive.
      - She planned at some point to do an adaptation of The Manor (1967) by Isaac Bashevis Singer
      - Akerman references Deleuze & Guattari's book on Kafka, where "minor literature" is discussed, which is very relevant as you could see her films as part of a "minor cinema"
    quotes:
      - "when I first did [Hotel Monterey], I didn't know exactly how it would look. But I directed the shots like this: I put the camera down, found the frame, and when I felt the shot was finished, stopped it. So the shots are exactly as long as I had the feeling of them inside myself."
      - "When you look at a picture, if you look just one second, you get the information, 'that's a corridor.' But after a while you forget it's a corridor; you just see that it's yellow, red; that it's lines; and then again it comes back as a corridor. If you don't stay long enough, if you don't stare, you will never forget that this is information about a corridor"
      - "you can describe Michael Snow's films on a piece of paper. Okay, you have to experience the time and everything, but in fact it's one idea; he pushes one idea until the end. He's a conceptual artist. I don't have an idea. I have a feeling that I try to express."
      - "(of Je, tu, il, elle) It's not voyeuristic because the camera doesn't move. If the camera had moved, and picked up something, singled out something, it would have been different. But the way the camera stayed, fixed—it's very dignified."
      - "People were a little bit angry at me because of the murder at the end of Jeanne Dielman . . . She does it and then she sits for seven minutes. And then you don't understand her. You will never. I hope you never will—that's the strength of the film. You will never know what is happening in her mind and in her heart. I don't know either. It's the secret of Delphine Seyrig, not the character she's playing. It's not Jeanne Dielman's secret, it's Delphine's secret."
      - "...the fact that [Kafka] not using his own language, but another language that isn't his mother tongue. I feel the same way when I speak French, it's not exactly my language."
    films: 
      - Hotel Monterey
      - Saute ma ville
      - News from Home
      - Je, tu, il, elle

