  - title: The Eyes of the Fourth Person Singular
    author: Bradley, Joff
    in:
      title: Deleuze Studies
      volume: 9
      issue: 2
      year: 2015
    pages: 185-207
    tags:
      - Deleuze & Guattari
      - subjectivity
    notes: |
      - Presents the idea that the voice of the fourth person singular is like T.S. Eliot's idea that "genuine poetry can communicate before it is understood"
      - Discusses Deleuze's writings on the pronoun "On" (One) and how it relates to the fourth person singular as something depersonalised, evacuated of subjectivity
      - The infinitive, subjectless, incorporeal events seem to capture the basis of Deleuze's fourth person singular, which then further includes the ontological implications of such events
      - It seems important that this is not "non-individual", but rather "pre-individual", because these pure events are what constructs the individual
      - It captures the "splendor of the impersonal they", related to the Other, I would imagine
      - "The fourth person singular sees all and understands nothing."
      - The fourth person singular cannot be a grammatical construct, and must remain a philosophical one:
        - "Although no one speaks the fourth person singular, it nevertheless subsists in all that is said. It is the murmur behind all utterances."
      - "Deleuze looked to forge a philosophy to dislodge and decentre the 'I', or speaking subject."
      - "Subjectivity is taken as never pre-existent but always produced."
        - The producer is that pure event, the fourth person singular
      - "Deleuze's take on Blanchot's analysis of death is to see it as having both a relation and nonrelation to the body, to my body. Death is incorporeal and infinitive; it is always elsewhere. It is impersonal and grounded only in itself. As such every event is like death, 'double and impersonal in its double'"


  - title: The Fourth Person Singular (Je Tu Il Elle)
    author: Narboni, Jean
    in: 
      title: Cahiers du cinéma
      issue: 276
      year: 1976
    pages: 5-14
    tags: 
      - Chantal Akerman
      - subjectivity
      - queerness
      - feminism
    films:
      - Je, tu, il, elle
    notes: |
      - Discusses the use of background noise as a crucial element of the film; how it lends the film intensity and is "at the threshold of word-formation"
      - Looks at the way the third segment defies pornographic conventions of sex through its violence, the sounds, the way the act is announced as limited in time, but especially through the static camera
      - The static camera, he argues, goes against the usual pornographic conventions of using a multiplicity of shots to create a sense of excitement and of the limitless possibilities of the act
      - Akerman instead, he suggests, illustrates Lacan's ideas of two bodies being unable to become "One" (l'Un)
      - He references Kafka's metaphor of nut cracking from "Josephine the Singer, or the Mouse Folk" to describe the way the film uses seemingly mundane techniques and events in a way that invokes intrigue and discussion, so there must be something non-mundane underlying them.
        - "Have artists not proven themselves to be precisely those who, tirelessly, seek to inscribe [...] a sign of that invisible, impossible real, which forever eludes being written down? Like cracking nuts, only to reveal that the point [...] is to do something other than merely cracking nuts; to step outside of language while remaining within it, to move beyond the image while staying within the image; to show no fear of exhibiting oneself or putting oneself on display, all in order to subvert exhibitionism and production themselves."
      - The "fourth person singular" is a concept I struggle with, but here are my notes based on some deeper readings:
        - It seems to build on concepts from Deleuze (who himself built it from a poem by Lawrence Ferlinghetti)
        - Narboni invokes the phrase *ça montre* (it shows) in relation to Je, tu, il, elle, which is a term from Lacan by way of Freud ("Le Ça" being the French term for the Id)
        - Lacan's *ça montre* appears to refer to something showing itself beyond the level of conscious subjectivity. In Narboni's case, this is likely tied to the cinema image itself, where what matters is less who sees than the fact that something shows itself.
        - Narboni's Blanchot quote ("part de l'événement que son accomplissement ne peut réaliser") is from the book The Space of Literature, specifically the section "The Secret of double Death" in the chapter on "Rilke and Death's Demand" (Rilke being the poet Rainer Maria Rilke)
          - The full quote (translated) is "There is much to suggest that the movement by which he purifies death, by taking away its random character, forced Rilke to incorporate this randomness in its essence, to close it upon its absolute indeterminacy, so that instead of being only an improper and untimely event, death becomes, at the heart of its invisibility, that which is not even an event, that which is not accomplished, yet which is there, the part of this event which its accomplishment cannot realize."
          - Apparently Rilke desired to make death something individual, something cultivated throughout one's life, and Blanchot's argument is that personalising death so completely paradoxically makes it indeterminate. Death ceases to be a simple event that happens at a particular moment, and instead becomes something that can never be fully experienced or realised as an event.
          - The one who dies is, in a sense, the only person for whom death matters absolutely, yet also the one who can never experience it as a completed experience. Death becomes "the part of the event which its accomplishment cannot realize".
          - You could therefore see death as an event that is always looming or approaching, but which can never become fully present or complete itself as experience.
          - This isn't exactly Lacan's Real, but it seems adjacent to it: something that resists presentation, symbolisation, or subjective mastery.
        - Deleuze's conceptialisation of "fourth person" also bases some of its ideas on Blanchot's analysis of death and impersonal events.
          - For Deleuze, singularities and events are primary, while subjects and identities emerge secondarily from them.
          - The "fourth person" refers not to another grammatical person beyond I, you, he/she, but to an impersonal field of events existing prior to subjectivity.
          - It is the depersonalised, pure event; not something that happens to an already-formed subject, but something from which the subject itself emerges.
        - Nabroni also uses the term "temps du moins-que-parfait", which is a play on "pluperfect tense" (plus-que-parfait). 
          - You could read "temps du moins-que-parfait" as a kind of "less-than-perfect tense": a temporality that cannot be fully completed or concluded.
          -  An event that is not fully realised, but nonetheless persists or remains in some sense.
        - Putting all of this together, Nabroni's use of "fourth person singular" seems to be about the way cinematic images can point toward an impersonal level of experience that precedes subjectivity. Rather than showing what "I" see, what "you" see, or what happens to a particular individual, the image can reveal anonymous events: a *ça montre* in which something shows itself without belonging to any stable subject. In this sense, the "fourth person singular" names the event itself, not yet organised into a person, and perhaps never fully completed within one.
        - Particularly for Je, tu, il, elle, it seems to describe the way the film moves through the pronouns of its title without allowing any of them to become definitive. Julie is successively "I", "you", companion to "him", and lover of "her", yet the film repeatedly shifts attention away from identities and towards durations, encounters, movements and desires themselves. The "fourth person singular" would then name this impersonal level of experience.
      - Narboni suggests that the film is cyclical, in that the first segment could follow the third
      - "Sometimes [the commentary of the film] is precise, at other times it is out of sync (ahead of or behind the image), and occasionally it even contradicts what is on screen—describing what she is doing, is about to do, thought she did, or failed to do. Almost never, however, does it reveal what she is thinking or feeling"
      - "There is much discussion at present regarding what might constitute a specifically feminine mode of writing, or how feminine jouissance informs artistic practices. Yet, it is becoming increasingly clear that this cannot be reduced to explicit, assertive content, nor to a binary opposition between a 'good' feminine space (characterized by non-violent relations) and a 'bad' masculine space (defined by power dynamics). Furthermore, it has nothing to do with the foolish dichotomy that separates spontaneity or lived experience (supposedly inherent to women) from discourse or theory (supposedly the domain of men)."
        - This echos what Turim writes in her essay on the film, about how the film has a troubled and non-binary relationship to gender
  
  - title: "Women at the Keyhole: Feminism and Women's Cinema"
    author: Mayne, Judith
    publisher: Indiana University Press
    year: 1990
    tags: 
      - Chantal Akerman
      - feminism
      - queerness
      - authorship
      - identity
      - subjectivity
      - interior space
      - desire
      - Jacques Lacan
    notes: |
      - I read the chapter "Mistresses of Discrepancy", which focuses *Je, tu, il, elle* and Ulrike Ottinger's *Ticket of No Return*
      - Begins with reference to Dorothy Arzner, who worked within the Hollywood studio system in the golden age
      - Considers female friendship and lesbian marginality
      - Argues that, while some lesbian autobiographical filmmakers, like Diane Kurys, have their self-representation "wrapped in a fiction of the author that is totally compatible with the fictions of narrative cinema" whereas Akerman appears "in ways that expose and undermine those fictions, not only because of the explicit lesbian desire which defines the relationship of [Akerman to her film text], but more specifically because of how that desire is represented, through the exposition of pain, narcissism, infantilism, and neediness"
      - A curious and almost completely irrelevant detail is that Mayne says that Akerman is eating "powdered sugar", whereas I almost always see it referred to as "granulated sugar"
      - Mayne suggests that the three shots that constitute the sex sequence in the final act "reflect in miniature the three-part structure of the film".
        - I'm not sure I entirely buy this
        - The three shots are: 
          - Rolling around in a somewhat violent, animalistic manner
          - Slow, sensuous kissing
          - Oral
        - I certainly see how the third part mirrors the eating sequence that directly preceeds the sex scene, but the first two parts seem less clearly connected to me
        - Regardless, it's an interesting observation. I guess one could see the rolling around, the "friction" as the friction that "Julie" feels against her place in life and her own body in the first segment. I would hardly describe the second act as like sensuous kissing though.
      - "Lesbian representation highlights contradiction in particularly strong ways, for lesbianism is both lure and threat for patriarchal culture as well as for feminism, and it challenges a model of signification in which masculinity and activity, femininity and passivity, are always symmetrically balanced."
        - Points to the rejection of binaries in sexuality and gender in their political dimension
      - "In [...] Je tu il elle, heterosexual and lesbian attachment are baldly juxtaposed in relation to an 'I' whose speaking self is somewhat detached from her corporeal self, a bodily presence marked by the intertwining activities of eating and writing."
        - Or in other words, the film is about the tension between the body and the mind, and how desire is expressed through a sexuality that is itself detached from strict conceptions
      - I really like the way she describes the de-subjectification of the sex scene, how there is no "marked place for the spectator":
        - "However, throughout all three of these shots, little separates the initiator from the recipient; little, that is, isolates active subject from passive object. The representation of the lovemaking departs absolutely from the codes of pornography, so that there is no cutting from 'subject' to 'object,' no isolation of a breast or genitalia as the fetishized object, no simulation of sexual frenzy. If neither Akerman nor the lover can be situated neatly within the pole of subject or object, in other words, neither is there a clearly marked place for the spectator."
      - Mayne also touches on the anti-pornographic presentation of the scene.
      - She suggests that the way the trucker looks at the camera after coming is a way of acknowledging that Akerman the actor and Akerman the director are one and the same. She goes on to discuss the dual nature of Akerman as object and Akerman as subject.
      - She touches on the film's preoccupation with internal vs external spaces, and thresholds
        - Clearly the room from the first section is an internal (interior) space, one that Akerman/Julie constructs
        - Mayne suggests that the truck has elements of interiority, such as the connection to the first part with Julie sleeping there
        - But the truck is less clear, as it is unclear what is "part of Akerman's spoken reality [...] and what is more properly associated with the realm of a separate, public sphere"  
        - "She takes off her clothes, submitting her body to the same process of unmasking as the room."
      - The ideas about control over a space is interesting: how Akerman/Julie shifts between different amounts of authorship/control over the physical places she inhabits
        - "Akerman is defined both as contained by—and occasionally even imprisoned by—the space that surrounds her, and as a powerful controller of that space."
        - Mayne argues that "in the first [part] Akerman seems more contained by her surroundings, and in the last she exercises more control over them"
        - I disagree with this. I think that in the first part, she is in control of her space is as much as she reconfigures it to represent her interiority. In the last part, she is a guest, and only for some time (as she explicitly says she will be leaving in the morning).
        - Mayne thinks that the second part is somewhere in-between, which I'm also not sure I agree with, as she is in a very transitory space that is not of her design
        - She also discusses the primary female gendering of the space in the first segment, by way of Lacan's symbolic order:
          - "[the film evokes] a female world that exists prior to or outside the realm of the symbolic order, an order determined by the regulation of the body and the simultaneous economy of the family and the word"
      - Pushes against the conception that this film represents heterosexuality as a poor substitute for lesbianism, and doesn't fall into the trap of "heterosexuality = bad, lesbian = good"
        - She rather sees the film as tracing a process of departure, isolation, and return as a trajectory of desire
        - Of course, coupled with other readings of the film as cyclical, this would suggest that desire has a cyclical nature
      - Looks at "orality" in the senses of eating, speaking, and sex
        - Desire is expressed through these three forms of orality, and the film is structured around them
        - Mayne draws on the historical labeling of lesbianism as a mental disorder caused by "arrested development."
        - These old clinical theories claimed that a lesbian's adult desire was actually a childish, "regressive" urge to fuse with the maternal figure.
        - The earliest bond with a mother is oral (feeding), which connects to the film's heavy use of food
        - Of course, we know that Akerman is deeply connected to her mother
        - Instead of viewing this "regressive" oral bond as a sickness, Akerman flips it into a source of female power.
        - "This affirmation of female subjectivity in the cinema occurs in several ways: through the connections between different forms of orality (eating, speech, sex), and between the literal and the figurative; through a movement back and forth from the positions of spectator to actor to writer; and through a series of resonances whereby the desire of the woman is linked to those of the child and the adult, to the desire to see and to be seen, to the desire to speak and to write."
      - She notes that she has said the film does not exactly fit as a "lesbian film", but also acknowledges the general difficulty in naming the film, in spite of the film being centrally concerned with naming/identity
        - "Je tu il elle and Ticket of No Return are less concerned with affirmative representations of lesbian experience than with explorations of the simultaneous ambivalence and pressure of lesbianism with regard to the polarities of agency and gender."
      - On the identity behind the pronoun "tu", Mayne says that virtually all of the subjects in the film occupy it at some point, but notes that in the first section, there is only one literal reference to this pronoun:
        - "When I lifted my head suddenly, there were people walking in the street. I still waited for them to leave or for something to happen. For me to believe in God or for you [tu] to send me a pair of gloves so I could go out in the cold"
      - She has a very interesting note on the fact that "tu" is also the past participle of the verb "se taire" (to make oneself silent):
        - "The eighth or ninth day, I started the second letter over again, and I ate a lot of powdered sugar for eight pages. And I crossed out...marked out...a few lines remained. I stopped eating and kept quiet [je me suis tu]."
      - "one could hardly find a contemporary woman's film more saturated with authorial signature than Je tu il elle"
    films:
      - Je, tu, il, elle
 
  - title: "The Birth of a New Avant-Garde: La Caméra-Stylo"
    author: Astruc, Alexandre
    in: 
      title: "The French New Wave: Critical Landmarks"
      publisher: BFI
      year: 2009
    tags:
      - authorship
      - language
    pages: 31-37
    notes: |
      - Originally published in 1948 in *L'Écran français*
      - This was one of the foundational essays that lead to auteur theory
      - Argues that cinema can be used to tackle any subject, not simply tell visual stories
        - This is very relevant for Akerman, who encodes deep philosophical and literary ideas into her films
      - This is a very concise and clear essay, very worth reading in its entirety
      - Astruc gives the film *L'Espoir* (1939) as an example of a film in which the cinematic language is exactly equivalent of literary language, suggesting that it may be the first film to do so
      - Interestingly, he speaks with some disdain of "poetic documentaries" and Surrealist films and the suggestion that these are the only way to break free of regular commercial filmmaking
      - "[...] I would like to call this new age of cinema the age of caméra-stylo (camera-pen). This metaphor has a very precise sense. By it I mean that the cinema will gradually break free from the tyranny of what is visual, from the image for its own sake, from the immediate and concrete demands of the narrative, to become a means of writing just as flexible and subtle as written language."
      - "It must be understood that up to now the cinema has been nothing more than a show. This is due to basic fact that all films are projected in an auditorium. But with the development of 16mm and television, the day is not far off when everyone will possess a projector, will go to the local bookstore and hire films written on any subject, of any form, from literary criticism and novels to mathematics, history, and general science. From that moment on, it will no longer be possible to speak cinema. There will be several cinemas just as today there are several literatures, for the cinema, like literature, is not so much a particular art as a language which can express any sphere of thought."
        - It is interesting to consider the ways in which this has and has not come to pass in the more than 70 years since this was written.
        - It is kind of true that everyone possesses a projector of sorts, and that we have access to a wide variety of films on any subject, and also that there are many different cinemas and cinematic languages
        - But it is also true that the commercial film industry is still very much dominated by a small number of studios and a very particular style of filmmaking
      - "Every film, because its primary function is to move, i.e. to take place in time, is a theorem. It is a series of images which, from one end to the other, have an inexorable logic (or better even, a dialectic) of their own."
        - I enjoy this definition, and the note of taking place "in time" is very relevant here, since time was so central to her films, and especially in the way they deviate from the norm and have their own "inexorable logic"
      - "Scriptwriters who adapt Honoré de Balzac or Fyodor Dostoevsky excuse the idiotic transformations they impose on the works from which they construct their scenarios by pleading that the cinema is incapable of rendering every psychological or metaphysical overtone. In their hands, Balzac becomes a collection of engravings in which fashion has the most important place, and Dostoevsky suddenly begins to resemble the novels of Joseph Kessel, with Russian-style drinking-bouts in night-clubs and troika races in the snow. Well, the only cause of these compressions is laziness and lack of imagination. The cinema of today is capable of expressing any kind of reality."
        - Akerman was planning to adapt Dostoyevsky's *The Idiot* around the time that she died, so it's interesting to consider how she would have interacted with this assertion
        - Given her adaptations of Proust and Conrad, I don't believe that it would have fallen into the traps that Astruc describes here, as she was very much interested in what truth lay beneath the surface of the text, rather than a simple visual representation of the text 

  - title: Notes on Cinematography
    author: Bresson, Robert
    publisher: Green Integer Books
    year: 1997
    tags: 
      - authorship
      - acting
    notes: |
      - He has some interesting thoughts on the nature of acting, or how best to direct actors:
        - "Movement from the exterior to the interior. [...] The thing that matters is not what they show me but what they hide from me, and, above all, *what they do not suspect is in them*"
        - "Between them and me: telepathic exchanges, divination"
        - "The actor projects himself before him in the form of the character he wants to seem; lends him his own body, face, voice; makes him sit down, stand up, walk; penetrates him with sentiments and passions he himself does not have. This 'I' who is not his 'I' is incompatible with cinematography."
      - He suggests that there are two types of films:
        - Those that use theatrical tools to *reproduce*
        - Those that use cinematic tools to *create*
        - I find this distinction pretty simplistic
      - Bresson gets into ideas about reproduction (e.g. the photograph of a painting) as not having the value or power of the original, very Walter Benjamin
      - Wow Bresson really rails against cinema as theatre here
        - I wonder if he saw Akerman's *Letters Home*
        - I do interpret his definition of "theatre" as being less about exactly theatre as an art form, and more about very particular technologies of the theatre in a direct representational sense
      - He very much sees cinema as its own complete art form, distinct from all others
      - "If an image, looked at by itself, expresses something sharply, if it involves an interpretation, it will not be transformed on contact with other images. The other images will have no power over it, and it will have no power over the other images. Neither action, nor reaction. It is definitive and unusable in the cinematographer's system."
        - This quote reminds me a lot of Tarkovsky's ideas about metaphor and symbolism from *Sculpting in Time*; how a cinematic image is not a directly-substitutable representation of some other thing, but rather a unique and self-contained entity that can only be understood in relation to other cinematic images and the viewer's own subjectivity
      - "Actors, costumes, sets and stage furniture are bound to make one think at once of the stage. Take care that the persons and objects in my film may not make people think at once of the cinematographer."
        - It is intriguing to me that Bresson is so concerned with the invisibility of the cinematographer, when his films are so stripped down and minimalistic that they take on a level of theatre
      - There is much here that is very counter to Akerman's work, yet I think their cinemas are very much in conversation with one another and are complementary in many ways
        - For example, this quote: "Actor. The 'to-and-fro of the character in front of his nature' forces the public to look for talent on his face, instead of the enigma peculiar to each living creature."
        - This is directly counter to much of the acting performances in Akerman's work, which, as Margulies notes, oscillate between literal and figurative registers
        - Ultimately, I think Bresson and Akerman ofter reach a similar end effect, but it seems that it is through very different, almost opposite means
        - One could say that they both reach a level of opacity in the presentation of the character, but the opacity is achieved is informed by conflicting philosophical approaches
        - However, they both align on the idea that the actor should have some secret that is not revealed to the audience, and may not even be fully known to the actor themselves
      - "What is for the eye must not duplicate what is for the ear"
        - This is a great quote for Je, te, il, elle, and the unsynced voiceover in the first section
      - The whole book is filled with gems; Bresson had quite the talent for stripped down writing as well as images. Here are some of my other choice quotes:
        - "Cinematograph is a writing with images in movement and with sounds."
        - "An actor in cinematography might as well be in a foreign country. He does not speak its language"
        - "An image must be transformed by contact with other images as is a color by contact with other colors. A blue is not the same blue beside a green, a yellow, a red. No art without transformation."
        - "The ejaculatory force of the eye"
        - "Be sure of having used to the full all that is communicated by immobility and silence."
        - "Don't run after poetry. It penetrates unaided through the joins (ellipses)."
        - "Neither the director nor the scenario-writer. Forget you are making a film."
        - "If, on the screen, the mechanism disappears andthe phrases you have made them say, the gestures you have made them make, have become one with your models, with your film, with you — then a miracle."
        - "Images and sounds like people who make acquaintance on a journey and afterwards cannot separate."
        - "Nothing too much, nothing deficient."
        - "Music takes up all the room and gives no increased value to the image to which it is added."
        - "A small subject can provide the pretext for many profound combinations. Avoid subjects that are too vast or too remote, in which nothing warns you when you are going astray. Or else take from them only what can be mingled with your life and belongs to your experience."
        - "A sound must never come to the rescue of an image, nor an image to the rescue of a sound."
        - "Gestures and words cannot form the substance of a film as they form the substance of a stage play. But the substance of a film can be that...thing or those things which provoke the gestures and words and which are produced in some obscure way in your models. Your camera sees them and records them. So one escapes from the photographic reproduction of actors performing a play; and cinematography, that new writing, becomes at the same time a method of discovery."
        - "Because you do not have to imitate, like painters, sculptors, novelists, the appearance of persons and objects (machines do that for you), your creation or invention confines itself to the ties you knot between the various bits of reality caught. There is also the choice of the bits. Your flair decides."
        - "Two simplicities. The bad: simplicity as starting-point, sought too soon. The good: simplicity as end-product, recompense for years of effort."
        - "Music. It isolates your film from the life of your film (musical delectation). It is a powerful modifier and even destroyer of the real, like alcohol or dope."
        - "Displaying everything condemns CINEMA to cliché, obliges it to display things as everyone is in the habit of seeing them. Failing which, they would appear false or sham."
        - "One does not create by adding, but by taking away."
        - "It is not a matter of acting 'simple' or of acting 'inward' but of not acting at all."
        - "Your camera catches not only physical movements that are inapprehensible by pencil, brush or pen, but also certain states of soul recognizable by indices which it alone can reveal."
        - "Accustom the public to divining the whole of which they are given only a part. Make people diviners. Make them desire it."
        - "Shudderings of images awakening."
        - "Ideas gathered from reading will always be bookish ideas. Go to the persons and objects directly."

  - title: Personal pronouncements in I...You...He...She and Portrait of a Young Girl at the End of the 60s in Brussels
    author: Turim, Maureen
    in: identity-memory
    pages: 9-26
    tags: 
      - Chantal Akerman
      - Jacques Lacan
      - authorship
      - queerness
      - subjectivity
      - performance
      - interior space
    films:
      - Je, tu, il, elle
      - Portrait of a Young Girl at the End of the 60s in Brussels
    notes: |
      - Uses the term "personal pronouncements" to describe the fictions that Akerman creates in these two films, because it "conjoins autobiography and enunciation to point towards a revelation of the intimate"
      - Apparently "personal pronouncements" was the original title of Je, tu, il, elle in the US release
      - The way that this says all personal filmmaking borders on autobiography is very true to Akerman's work in particular, both through her presence as an actor, and substitution in many of her films (or substitutions for her mother):
        - "In some sense, all writing and personal filmmaking border on autobiography, even when placed in the third person, or filmed without direct reference to the filmmaker's body or life"
      - Akerman's self suffuses the film even though she seemingly covers it in a veneer of fiction, and this is achieved through several techniques of artificiality and abstraction that create further links between Akerman the director and Akerman/Julie        
        - "even as the self is disguised by these ruses of language, the body of the author dominates the images"
      - Invokes the psychoanalytic concept of "acting out" (mettre en acte, ageren), indicating "actions taken by a subject in the grip of [their] unconscious wishes and fantasies"
      - The way the essay discusses the alternation between the textual character's voice and the authorial voice reminds me of the way Margulies describes oscillation between literal and figurative registers
        - "the revelation of her character's unconscious desires is shadowed by the hint of a revelation of an authorial, personal, autobiographical unconscious, as the space between fictive character and authorial voice is alternatively collapsed and expanded in the film's unfolding"
      - "Julie methodically pursues communication in the form of a letter-writing destined always to be rewritten and never to be sent. The only revelation of self she seems capable of committing consists of the merely physical."
        - Or in other words, she is unable to express her interiority through language, and instead expresses it through her body and the space she inhabits
      - Highlights Judith Mayne's assertion that the reading of the film as moving from isolation to "hesitant heterosexuality" to "triumphant lesbianism" is overly simplistic, and that the film denies this by its non-linear structure
        - "the film never seems to address a particular audience, never employs codes meant to offer it a privileged identification; this may account for Mayne's hesitation in calling the film a 'lesbian film'"
      - She also highlights Mayne's allusion to the fact that voice and image in the first section are not in sync
        - For example, Julie says she paints the furniture blue the first day, then green the second, but we never see the act of painting, nor the colours
        - Turim says that these establish a "pattern of mutability"
      - Turim makes the somewhat tenuous connection between the blue and green of the non-painting to the scene in Il deserto rosso, where Vitti is going through a shop painted with large blocks of colours
        - I think it's unlikely that it's a direct reference, but the connection to Il deserto rosso seems well-made, as that film also considers itself with spaces reflecting the psychology of the characters, and the use of colour to reflect interiority
      - The essay captures the difficulty of expressing one's interiority, and of making it concrete
        - "[the first segment offers] a staging of a difficulty with writing, a hesitation with a commitment of pencil to paper, and of self to permanent record of an enunciation"
      - The verfremdungseffekt is invoked to heighten the feeling that this is a performance, and to problematise the notion of authorship and subjectivity in the film
      - Similarly to Mayne, Turim takes issue with a simplistic reading of the film as a clear linear progression of the Je through the Il, to the Elle:
        - "this bare-bones structural version of the film is a stripping of it down to its elemental and symbolic pronomial quest, but it immediately invites a symbolic interpretation, reading into the image, monologues, dialogues, and sounds an investment that carries its own presuppositions"
      - She notes that all the pronouns are indirectly assigned, "recalling the hesitation about writing dramatised in the opening sequence": way in which Akerman the director hesitantly assigns identity mirrors the way Akerman/Julie hesitantly writes, suggesting further a connection between the authorial and textual voices
      - She discusses the concept of "filmic writing"
        - She notes that the hesitiation in writing offers a visual pun on the concept of "filmic writing"
        - Particularly, she compares it to Robert Bresson's *l'écriture filmique*, which is Bresson's term for what is elsewhere called the "caméra-stylo" (camera-pen)
          - *Caméra-stylo* is a term advanced by Alexandre Astruc in 1948 in his essay "The Birth of a New Avant-Garde: The Camera-Pen", which argues that cinema can be used to tackle any subject, not simply tell visual stories
          - Curiously, Turim cites Bresson's *Notes on Cinematography* as the source of the term, but I cannot find a mention of this term in the book, as wonderful as it is. I even read the same translation that Turim cites.
      - Invokes Julia Kristeva's term "soleil noir" (black sun): the dark lens through which desire is filtered
        - This is a concept discussed in Kristeva's book *Black Sun: Depression and Melancholia*, which is a psychoanalytic study of depression and melancholia
      - Turim links feeding with desire: desire for nurturance to desire for the breast
        - Similar to the way Mayne discusses orality
      - Compares the film to Godard, Warhol, Bresson, Antonioni, Deren, and Resnais
      - She notes how the sex sequence breaks the usual model of lesbian relationships as "always emotionally articulate", and instead presents inarticulate bodies and desire, thus breaking with traditional modes by which lesbianism is put on display for a third party audience, potentially male
        - "Only when they arrive at orality, at the former lover's embrace of Julie's labia, does the segment move from a quasi-wrestling match to a defined sex act, but, even so, the usual codes of sexual portrayals in filmic images are so avoided that viewers are left with a singular depiction of sex. This singularity is less that of women, of lesbian love, than that of a style of filmic writing that traces the awkward through to its own poetics, that refuses any romanticism in the flirtation with the physical, that troubles one's tactile imagination, one's imaginary and identificatory insertion into touch-portrayed as touch-felt."
        - The above quote also reflect the anti-pornographic presentation of the sex scene, similar to discussions in the Mayne and Narboni essays
      - "Julie arrives unnanounced because a letter could not be written and could not be sent; the body arrrives at the destination of the errant letter"
        - Derrida's *destinerrance*?
      - The most interesting part of this essay, I feel, is the musings on the troublement of gender in the film:
        - "If the truck driver [...] offers a form of typical masculinity, the lover offers a stereotyped femininity, marked in interior, food, and a submissive body that says 'no', but complies. Julie is a troubling third being, wandering through their spaces as a stranger, an alien".
        - My gender is a "troubling third being", what a great line
        - You could say more that Julie has a very fluid relationship to both gender and sexuality
      - Turim does a good job of discussing psychoanalytic interpretations while also noting their limitations:
        - "the glass door to Julie's apartment in the first segment in which she looks at herself, only to realise it is a transparency through which she can be seen. Finally, it becomes an opened door through which she leaves, and it remains open[...]. One could align this mirror via Lacan's theorisation of the mirror stage with a throubled passage through primary narcissism."
        - She notes Narboni's term "mirror-door-windows"
        - She discusses how such framings are drawn on a history of pathologising homosexuality as a deviant form of sexuality
        - "The goal for the long term seems to be to avoid fulfilling a traditional analyst's sense of who one is, in order to challenge the theory to accommodate the shifting politics of newly possible identities, ones that can only emerge as a culture becomes ready to let them be and develop"
      - On the subject of "Portrait of a Young Girl", Turim draws on political and historical readings of Lacan's seminars:
        - "Lacan draws connections between elements borrowed from existential philosophies in his thought and the events of May 1968"
        - She notes that Akerman has Michelle quote Kierkegaard
        - These thoughts seem to trail off somewhat, more just pointing at the fact that political context is reflected in the film, rather than making any strong claims about the political nature of the film or the impacts on the psyche of the characters
      - Turim finishes by attempting to place Akerman in a "larger history of art" by comparing her with the work of Marina Abramović, and Marie Audré
      - I found this essay very dense in its references, and I'm not sure it has more to say than the sum of those references, but it is worth a read for the number of rabbit holes that it opens up

  - title: What's beneath her smile? Subjectivity and desire in Germaine Dulac's The Smiling Madame Beudet and Chantal Akerman's Jeanne Dielman, 23 quai du Commerce, 1080 Bruxelles
    author: Flitterman-Lewis, Sandy
    in: identity-memory
    pages: 27-40
    tags: 
      - Chantal Akerman
      - subjectivity
      - desire
      - feminism
      - identity
      - jouissance
      - time
    films:
      - Jeanne Dielman
    notes: |
      - "The teenaged son Sylvain [...] functions as the masculine presence that defines both the terms and the limits of a world that Jeanne has doggedly tried to make her own"
        - Sylvain as the representative figure of patriarchy—I agree with this idea in that he is part of the structure that holds her captive so to speak, but he does not hold hierarchical power over her as an active oppressor. You could read this as a form of oppression-from-beneath, or a comment on the quieter ways in which patriarchy operates, so I think there's some interesting nuance there that isn't looked at in this essay
      - The precision of the details of the title giving the illusion of a heightened objectivity, without actually giving us any sense of her identity

      - The notion of "penetrating" the bedroom, which the camera is not allowed to do right until the penultimate scene
      - The distance and objectivity used to record the violence being the same as the usual household routine
      - How to define elusive interiority
      - Rather than the formal techniques employed representing a sense of interiority, the camera is held at a distance, and the interiority is represented by the performance and text:
        - "the emphasis on depicting unconscious processes, as opposed to evoking the unconscious through organised structures of the gaze"
      - Denying a "point-of-view" perspective and instead being an observer
      - Subjectivity constructed through sustained duration that invite's the viewer's speculation about Jeanne's thoughts
      - Says that Jeanne's "desires escape articulation", which I think is connected to Lacanian ideas of desire and lack, l'objet petit a, etc.
      - Discusses the absolute truth of an event, how the film conceptualises this as impossible, and that it places the viewer in the centre of meaning-making rather than being authoritative
      - This last point also reminds me of Toshio Matsumoto's ideas about subjectivity and involving the viewer in meaning-making to push for political engagement
      - Posits that the film's action forces the viewer to contemplate female sexuality as a key to unlocking the film's textual meaning: female pleasure is made into an interpretive framework
        - "every single reading of the film's action unavoidably hinges on some dimension of the feminine, because each one of these complex narrative moments is strategically, if subtly, shaped by questions of female sexuality"
      - Uses the term "knot of speculation" to describe the way the film's action is structured, which I think is a very apt description

  - title: "The feminine side of New York: travelogue, autobiography and architecture in News from Home"
    author: Barker, Jennifer M
    in: identity-memory
    pages: 41-58
    tags: 
      - Chantal Akerman
      - identity
      - autobiography
      - motherhood
      - daughterhood
      - New York
      - architecture
      - urban space
      - subjectivity
      - exile
      - language
      - feminism
      - sound
      - Walter Benjamin
      - chora
      - gender
    notes: |
      - Reading about the World Trade Center in things from before 9/11 is weird
      - "[Akerman] is present only in the sense that she occupies the same spaces in which her subjects live and work"
      - Ground-level observation of a city is very different from the lofty viewpoint of a skyscraper, not like a "voyeur-god"
        - "The camera never tilts up to catch a glimpse of skyscrapers disappearing into the clouds above, but remains firmly grounded; this is a landscape of subway tunnels, of alleys, of the hidden places of the city, places just outside the margins of visibility and legibility."
      - Akerman focuses on the minor dwelling spaces rather than major landmarks
      - The idea of bodies and cities having a reciprocal relationship of construction and writing-on is very interesting
      - Takes ideas from de Certeau's "Walking in the City" and applies them to Akerman's work
      - She draws on this quote from Certeau, which I find fascinating:
        - "The act of walking is to the urban system what the speech act is to language or to the statements uttered. At the most elementary level, it has a triple 'enunciative' function: it is a process of appropriation of the topographical system on the part of the pedestrian (just as the speaker appropriates and takes on the language); it is a spatial acting-out of the place (just as the speech act is an acoustic acting-out of language); and it implies relations among differentiated positions, that is, among pragmatic 'contracts' in the form of movements (just as verbal enunciation is an 'allocution,' 'posits another opposite' the speaker and puts contracts between interlocutors into action). It thus seems possible to give a preliminary definition of walking as a space of enunciation."
        - Akerman is very concerned with communication, or blockages in communication, and this posits that her interest in cities and the relationship between them and the body/mind is also a furtherance of this concern
      - "By constructing her own autobiography through the reading of her mother's words, by thus paralleling their autobiographical acts, Akerman demonstrates that subjectivity is a function of connections to others, is constructed within a social context, that it arises and articulates itself only through its relation to others."
      - Addresses Giuliana Burno's idea of "the touristic gaze"
      - Defines the architect-subject as generally male and the pedestrian-subject as generally female
        - "The construction of the self becomes a spatial issue; gender relations are written onto the body of the city, shaping it and shaped by it."
      - Identifies the spaces hidden at the high vantage point as female, by way of the female gendering of "chora" (via Elizabeth Grosz); I'm not sure I totally buy this, but it's something to ponder
      - I love this essay, it's so good
    films:
      - News from Home

