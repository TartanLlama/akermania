  - title: "A Tree in the Wind: Chantal Akerman's Later Self-Portraits in Installation and Film"
    author: Flitterman-Lewis, Sandy
    in: afterlives
    pages: 13-25
    tags:
      - Chantal Akerman
    films:
      - D'Est
      - La-bas
      - No Home Movie
      - News from Home
    notes: |
      - "[The themes she explores] radiate from Akerman's central project of continually defining and communicating her complex and contradictory self, a self profoundly embedded in history and intensely cognizant of contemporary realities, especially those impacting on her life as a Jewish woman."
      - "*No Home Movie* and *La-bas* are also the films that most reflect an inner subjective core at one with a landscape that Akerman doesn't wholly own"
        - Hmmmmmmmm
        - Hmmmmmmmmmmmmm
        - Hmmmmmmmmmmmmmmmmmmmmmmmmmmm
        - Yeah, I think this is true
      - "Akerman has stated her preference for installation art because it is more direct, more expressive of her sense of self-in-relation, and more evocative of the intersections of the personal and the social."
      - She says Akerman's installations "absorb their viewers in a palpable experience of emotional time"
        - Beautiful quote
      - In her later work she "finds new ways to articulate the unspeakable, to philosophise absence, and to explore the depths of the ever-present unseen"
      - She knotes Cecile Chich: "Chantal's films are always about the unfathomable void which is the mark of her mother's direct experience of the Holocaust"
        - Absolutely correct
        - This is from a private conversation with Cecile Chich, I can't find any written record for it
      - "While many of Akerman's early films [...] contain oblique references to the psychic wound of the Shoah, she does not specifically treat it literally until the question emerges in the space between film and installation begun with the due D'Est (1993) and D'Est: au bord de la fiction (1995)"
        - This doesn't seem right to me
        - I would argue that *Les Rendez-vous d'Anna* is a very fairly direct engagement with the "psychic wound of the Shoah", as some of the characters note its impact on them - sure, obliquely, but I think that with the direct motivation of the textual reference, the effects of the Holocaust on that film are more literal than suggested here
        - If not *Les Rendez-vous d'Anna*, then *Dis-moi* absolutely engages literally with it, going so far as to have interviews with people who speak explicitly about their family members being gassed at Auschwitz.
      - Of *American Histories*, Bérénice Reynaud says "[this] is a film of phantoms, filmed in a phantom city, that confronts [...] the symbolic work of death [...] trying to answer the essential question of our time: 'how can one make cinema after Auschwitz?'"
        - This is in an essay published alongside Akerman's *Autoportrait en cinéaste*
      - Flitterman-Lewis suggests that Akerman's installation *Au bord de la fiction* pairs the footage of *D'Est* with a "meditation on the (largely unanswered) questions of both Jewish identity and the Shoah", which imbues the earlier footage with a new significance.
        - Later in the essay, she explains how the installation consists of 24 screens showing elements of *D'Est*, with an additional 25th screen in a separate room where Akerman reads the 2nd commandment (Bilderverbot), and includes personal reflections:
        - "Yesterday, today, and tomorrow, there were, there will be, there are right now, even, people that history (without a capital H) comes to strike. People who are there, rounded up in herds, waiting to be killed, hit, or starved; people who walk without knowing where they're going, in a group or alone."
      - Of *D'est*, she says: "The film itself literally retraces in reverse direction [...] the migration of the Jews as they fled westward from the violence of pograms and anti-Semitic riots."
      - Of *Au bord de la fiction*: "without ever stating it explicitly, in this installation Akerman's virtual confession evokes the Shoah, whose implicit presence in the film must await the *performance* of this intimate and specific anxiety to gain its meaning"
        - I don't think that's necessarily the case. Of course it strengthens the connection, but Akerman's work had referenced the Shoah in various ways prior to this installation, it has always been on the edges of the text of her films, and of course suffuses the subtext. But even from those edges of text, we can still interpret and engage with the Holocaust's impact on her work meaningfully without the necessity of this particular performance.
        - Golden Eighties came out several years before this installation, and is another example of a work that contains both subtle textual references to the Holocaust and deep engagement with its lingering effects in its construction and the psyches of the characters.
      - She quotes from Schmid's book:
        - "*"D'Est* is arguably Chantal Akerman's most complex and representative work on time, space and memory. Expanding traditional boundaries of the documentary with her stylized images bordering on fiction and letting echoes of the past haunt her portrait of the present, the director creates a multi-layered work which collapses past, present and future into. a hallucinatory vision; a work replete with memory, but which eschews explicit commemoration and one which, through its haunted images of destitution, warns of humanity's fragility before the vagaries of History"
        - I love this quote, especially "collapses past, present and future into a hallucinatory vision", which seems related to some of Walter Benjamin's ideas on history and memory, particularly his notion of the "dialectical image" 
        - This reminds me of the concept of a "lieu de mémoire", which refers to a site that acts as a container of memory, but it is very much in the sense of commemmoration, even state-sanctioned commemoration, which I feel takes some power away from the concept. Schmid's not about avoiding commemoration is a key one, as these landscapes evoke a more full, haunting engagement with memory that is not confined to official narratives.
      - She goes on to discuss Akerman's final installation, *NOW*:
        - She describes it as "the culmination of the injunction against image-idolatry that shaped the final sequence of *Bordering on Fiction* [...], and it finally makes sense as a guiding principle of Akerman's art."
        - "Here the brutalities of the memory of the Shoah [...] are suggested in a refusal of representation as the viewer is made to question the significance of these long travelling shots [...] while Akerman diffuses herself among the perplexing images, present only in the suggestions of authorship and a few whispered lines."
      - She describes *La-bas* as a "'subjective documentary', as much about Akerman's own complex histories as it is about the place that evokes them."
      - She quotes Dana Gilerman's essay *In Exile: Here, There, and Everywhere", who describes the film as creating "a sense of strangled space"
        - This notion of "strangled space" seems a good descriptor for the space in many of her films. As if the space is not just confining the characters, but is also itself constricted. This also contributes to the idea of a character and their environment reciprocally shaping each other.
      - She also quotes Akerman from *La-bas*: "I don't feel like I belong. And that's without real pain, without pride. No, I'm just disconnected. From parctically everything. I have a few anchors. And sometimes I let them go or they let me go and I drift. That's most of the time. Sometimes I hang on. Far a few days, minutes, seconsd. Then I let go again."
        - Such a deeply sad and poignant quote
        - It could also describe the state of many of her characters (or rather, the substitution of a character for Akerman is often clear in their sense of rootlessness)
        - On the anchors, Flitterman-Lewis quotes the Pajama interview: "The only subject of my films is my mother"
      - "Because of the inherited memory of the Shoah, Chantal places herself in a line of matrilineal suffering that embraces her mother, her (unknown) grandmother, and that community of women [...] who share, whether articulated or not, stories and memories of an unspeakable past."
      - On *No Home Movie*: "It is here that the nexus of Mother, Memory, Shoah and Home coalesce in what will be a final and finite representation."
      - She makes a connection between *No Home Movie* and *News from Home*: "In [News from Home] Nelly's longing for her far away daughter is rendered on the soundtrack; Chantal reads her mother's letters from Nelly's unseen Brussels apartment as her camera discloses varied images of everyday New York. In her final film, it is Chantal who does most of the talking, either from within Nelly's apartment, or in Skyped conversations and deliberations with her editor over the video image."
      - "[The spaces in No Home Movie] are relatively empty spaces that we know are imbued with meaning. Now it is the mother who is visually embodied, present even as she is disappearing from life."
        - Strangled spaces, dead spaces, haunted spaces
      - 


