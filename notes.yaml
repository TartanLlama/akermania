  - title: 'The Captive: Frédéric Bonnaud talks to Chantal Akerman'
    in:
      title: Enthusiasm
      issue: 4
      year: 2001
    pages: 12-17
    tags:
      - Chantal Akerman
      - interview
    notes: |
      - "I thought that literary works should not be adapted to film, that music should not be used, that cutaways and shot/counter-shots should not be used — these kinds of prohibitions. I was radical, undoubtedly too much so, but I needed to be in order to define myself, form myself as a filmmaker."
        - Interesting to have Akerman say that she was more 'radical' earlier in her career than later
        - I would not necessarily agree with this, probably a better word is 'dogmatic'
