  - title: "Antifascism and the Avant-Garde: Radical Documentary in the 1960s"
    author: Alekseyeva, Julia
    publisher: University of California Press
    year: 2025
    tags: 
      - fact/fiction
      - subjectivity
    notes: |
      - Very relevant to Akerman in the way that Matsumoto blurred the lines between fact and fiction
      - He believed that avant-garde neo-documentary was the only truly revolutionary filmmaking practice
      - Like Akerman, he denied a purely objective truth, and instead focused on the viewer's subjectivity, unsettling their habitual perception, and implicating them in the construction of meaning
      - The sections on Vertov and Godard would also be relevant, but I find the connection to Matsumoto more compelling

  - title: "In Search of Lost Time: The Way by Swann's"
    author: Proust, Marcel
    translator: Davis, Lydia
    year: 2003
    publisher: Penguin Classics
    tags:
      - Marcel Proust
      - time
      - memory
    notes: |
      - This will be updated with random musings as I slowly make my way through the book
      - I think this is a very relevant book to Akerman's work, especially in terms of the way she captures time and memory, and of course because of her adaptation of The Prisoner in The Captive
      - Desire seems formulated in a similar way to many of Akerman's films, in that it is unattainable, but deeply yearned for, like the dream of a lover that is shattered upon waking
    quotes:
      - "my mother [...] watched [my father] with a tender respect, but not so intently as to try to penetrate the mystery of his superior qualities"


themes_and_concepts:
  - name: postmemory
    definition: The relationship that the "generation after" bears to the personal, collective, and cultural trauma of those who came before—to experiences they "remember" only by means of the stories, images, and behaviors among which they grew up.
    notes: |
      - From Marianne Hirsch
      - I think this is a theme that runs through almost all of Akerman's work
      - The Holocaust is an obvious instance of postmemory, which I think you can see as far back as Hotel Monterey, counter to some essays I have seen that only see it from D'Est (1993) onwards (which is absurd to me)

  - name: postmemorial objects/landscapes
    definition: Objects/places that serve as a means of transmitting postmemory, such as photographs, letters, and other artifacts that carry the weight of historical trauma and memory.
    notes: |
      - I haven't seen this term discussed in relation to Akerman's work, but I've seen it in other essays, such as "Third-Generation Voices: Memory and Identity in the Palestinian Diaspora"
      - This is an area I'd very much like to explore further

  - name: hauntology
    definition: The way the past, or lost ideas of the future, refuse to stay dead and instead haunt our present reality. The feeling that a modern space is crowded with the invisible presence of what used to be there.
    notes: |
      - From Jacques Derrida
      - Very relevant to Akerman's work, especially in terms of the way she captures spaces that are haunted by the past, such as in Sud and D'Est

  - name: jetztzeit
    definition: time that is ripe with revolutionary possibility, time that has been detached from the continuum of history. It is time at a standstill, poised, filled with energy, and ready to take the 'tiger's leap' into the future.
    notes: |
      - From Walter Benjamin
      - I don't quite understand this concept yet, but I think because of the way Akerman's work captures time and a moment's place in a complex history, it seems relevant

  - name: mi-dire (half-said)
    definition: "no truth can be spoken: like the subject which it comprises, it can only be half-spoken"
    notes: |
      - From Jacques Lacan
      - Akerman invokes this concept in Autoportrait en cinéaste: 'I'll put the camera there, in front, as long as is necessary and the truth will appear. [...] that cannot be said except by taking it to the end, saying it in halves, as Lacan suggests.'

  - name: Lacanian gaze
    notes: |
      - From Jacques Lacan
      - I'll be honest, this concept makes very little sense to me, but given Akerman's interest in both Lacan and ways of looking, it seems important to include and read more about
      
  - name: talk blocks 
    definition: Dialogues so distended that they work as monologues
    notes: |
      - From Ivone Margulies

  - name: Lacanian orders
    definition: "The three orders of the psyche as defined by Jacques Lacan: the Imaginary, the Symbolic, and the Real"
    notes: |
      - A useful framework for evaluating the different dimensions of subjectivity and desire in Akerman's work

  - name: Brechtian alienation/distancing effect/verfremdungseffekt
    definition: A technique used in theater and film to prevent the audience from becoming emotionally involved in the narrative, instead encouraging critical detachment and reflection on the social and political implications of the work.
    notes: |
      - From Bertolt Brecht
      - I think this is a very useful concept for understanding Akerman's work, especially in terms of her use of long takes and static shots that create a sense of distance and objectivity

